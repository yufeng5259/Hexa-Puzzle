<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Hexa Puzzle</title>
    <meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1,minimum-scale=1,maximum-scale=1,viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="screen-orientation" content="portrait">
    <meta name="renderer" content="webkit">
    <meta name="force-rendering" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <link rel="stylesheet" type="text/css" href="./style.css">
    <link rel="icon" href="favicon.ico">
  </head>
  <body>
    <div id="GameDiv" cc_exact_fit_screen="true">
      <div id="Cocos3dGameContainer">
        <canvas id="GameCanvas" tabindex="99"></canvas>
      </div>
    </div>
    <div id="orientation-lock" role="status" aria-live="polite">
      <strong>PORTRAIT MODE</strong>
      <span>Rotate your device to continue.</span>
    </div>
    <!-- Polyfills bundle. -->
    <script src="src/polyfills.bundle.js" charset="utf-8"></script>
    <!-- SystemJS support. -->
    <script src="src/system.bundle.js" charset="utf-8"></script>
    <!-- Import map -->
    <script src="src/import-map.json" type="systemjs-importmap" charset="utf-8"></script>
    <script>
      System.import('./index.js').catch(function (error) { console.error(error); });
    </script>
  </body>
</html>
